<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nt-stacked-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="50%" stop-color="#7A3CFF" />
      <stop offset="100%" stop-color="#FF2D95" />
    </linearGradient>

    <linearGradient id="nt-text-white" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="nt-accent-sub" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#7A3CFF" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="#050505" />

  <!-- Logo Mark (Centered Top) -->
  <g transform="translate(230, 90) scale(0.68)">
    <path d="M 120 392 L 120 136 C 120 109.49 141.49 88 168 88 C 183.82 88 198.05 95.66 206.88 107.52 L 316 254 L 316 148 C 316 134.75 326.75 124 340 124 C 353.25 124 364 134.75 364 148 L 364 210 C 364 223.25 353.25 234 340 234 C 326.75 234 316 223.25 316 210" 
          stroke="url(#nt-stacked-grad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <path d="M 168 136 L 316 320 L 168 392 Z" 
          fill="none" stroke="url(#nt-stacked-grad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Equalizer AI Signal Node Bars -->
    <rect x="330" y="70" width="20" height="46" rx="10" fill="#00D4FF" />
    <circle cx="340" cy="52" r="9" fill="#00D4FF" />

    <rect x="364" y="44" width="20" height="72" rx="10" fill="#4B5BFF" />
    <circle cx="374" cy="26" r="9" fill="#4B5BFF" />

    <rect x="398" y="60" width="20" height="56" rx="10" fill="#7A3CFF" />
    <circle cx="408" cy="42" r="9" fill="#7A3CFF" />

    <rect x="432" y="82" width="20" height="34" rx="10" fill="#FF2D95" />
    <circle cx="442" cy="66" r="9" fill="#FF2D95" />
  </g>

  <!-- Typography (Centered Bottom) -->
  <g transform="translate(400, 520)" text-anchor="middle">
    <!-- NEOTUNES -->
    <g transform="translate(-190, 0)">
      <text x="0" y="20" font-family="'Satoshi', 'SF Pro Display', sans-serif" font-weight="900" font-size="80" letter-spacing="10" fill="url(#nt-text-white)">NE</text>
      
      <circle cx="170" cy="-10" r="32" fill="none" stroke="url(#nt-stacked-grad)" stroke-width="12" />
      <polygon points="163,-25 163,5 185,-10" fill="url(#nt-stacked-grad)" />

      <text x="220" y="20" font-family="'Satoshi', 'SF Pro Display', sans-serif" font-weight="900" font-size="80" letter-spacing="10" fill="url(#nt-text-white)">TUNES</text>
    </g>

    <!-- Tagline: FEEL EVERY BEAT -->
    <text x="0" y="100" font-family="'Satoshi', 'SF Pro Display', sans-serif" font-weight="700" font-size="26" letter-spacing="18" fill="url(#nt-accent-sub)">FEEL EVERY BEAT</text>
  </g>
</svg>
