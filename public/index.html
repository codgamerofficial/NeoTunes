<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NeoTunes</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0B0E14;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe src="https://neotunes.vercel.app" id="neotunes-frame"></iframe>
  <script>
    // Seamless production server redirect if iframe is restricted
    if (window.location.hostname === 'localhost' && window.Capacitor) {
      window.location.href = "https://neotunes.vercel.app";
    }
  </script>
</body>
</html>
