<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="charcoalGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#363F47" />
      <stop offset="50%" stop-color="#20252A" />
      <stop offset="100%" stop-color="#111417" />
    </radialGradient>
    <linearGradient id="silverGlory" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#C5CDD6" />
      <stop offset="100%" stop-color="#7B8895" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F0F3F7" />
      <stop offset="100%" stop-color="#D0D7DE" />
    </linearGradient>
    <linearGradient id="sunglasses" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF2E9A" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#charcoalGrad)" />

  <!-- Moody car silhouette backdrop -->
  <path d="M40,320 Q120,240 300,230 Q480,240 560,320 L600,480 L0,480 Z" fill="#13171A" opacity="0.6" />

  <!-- Stylized Figure in White Tuxedo / Suit -->
  <g transform="translate(300, 240)">
    <!-- Shoulders & Suit Jacket -->
    <path d="M-150,160 L-130,50 L-60,0 L0,-10 L60,0 L130,50 L150,160 L120,200 L-120,200 Z" fill="url(#suitGrad)" />
    <!-- Lapels -->
    <path d="M-60,0 L-10,120 L0,120 L-25,40 Z" fill="#E2E7ED" />
    <path d="M60,0 L10,120 L0,120 L25,40 Z" fill="#E2E7ED" />
    <!-- Black bow tie & collar -->
    <polygon points="-25,18 25,18 0,35" fill="#181B1F" />
    <polygon points="-20,25 0,15 20,25 0,35" fill="#0A0C0E" />

    <!-- Head & Hair -->
    <ellipse cx="0" cy="-60" rx="36" ry="46" fill="#D69B72" />
    <!-- Slick silver-grey hair & beard -->
    <path d="M-36,-75 Q0,-120 36,-75 Q32,-60 30,-50 Q-30,-50 -36,-75 Z" fill="#9DA7B2" />
    <path d="M-32,-45 Q-36,-15 0,-10 Q36,-15 32,-45 Q26,-28 0,-25 Q-26,-28 -32,-45 Z" fill="#8E99A5" />

    <!-- Orange tinted sunglasses -->
    <rect x="-32" y="-68" width="28" height="15" rx="3" fill="url(#sunglasses)" opacity="0.95" />
    <rect x="4" y="-68" width="28" height="15" rx="3" fill="url(#sunglasses)" opacity="0.95" />
    <line x1="-4" y1="-61" x2="4" y2="-61" stroke="#FFD700" stroke-width="2" />

    <!-- Hand pointing forward with gold ring -->
    <circle cx="2" cy="70" r="18" fill="#D69B72" />
    <rect x="-4" y="48" width="12" height="24" rx="6" fill="#D69B72" />
    <!-- Gold Ring -->
    <ellipse cx="2" cy="62" rx="7" ry="4" fill="#FFD700" stroke="#B8860B" stroke-width="1.5" />
  </g>

  <!-- Production text above GLORY -->
  <text x="300" y="375" 
        font-family="'Inter', sans-serif" 
        font-size="11" 
        font-weight="700" 
        letter-spacing="5" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        opacity="0.6">
    BHUSHAN KUMAR'S
  </text>

  <!-- 3D Silver Embossed GLORY Title -->
  <text x="300" y="445" 
        font-family="Impact, Arial Black, sans-serif" 
        font-size="96" 
        font-weight="900" 
        letter-spacing="10" 
        text-anchor="middle" 
        fill="url(#silverGlory)"
        opacity="0.85">
    GLORY
  </text>

  <!-- Artist Subtitle -->
  <text x="300" y="485" 
        font-family="'Inter', sans-serif" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="8" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        opacity="0.5">
    YO YO HONEY SINGH
  </text>
</svg>
