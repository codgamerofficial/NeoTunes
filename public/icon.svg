<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D14" />
      <stop offset="100%" stop-color="#121622" />
    </linearGradient>

    <!-- Master Brand Gradient: Cyan -> Blue -> Purple -> Magenta -->
    <linearGradient id="neotunes-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18D8FF" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FF4FD8" />
    </linearGradient>

    <!-- Gloss Highlight Overlay -->
    <linearGradient id="gloss-overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Tile Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Outer Brand Border Halo -->
  <rect x="12" y="12" width="488" height="488" rx="100" stroke="url(#neotunes-brand)" stroke-width="6" stroke-opacity="0.4" filter="url(#neo-glow)" />

  <!-- 3D Soft Gloss Tile -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="url(#neotunes-brand)" opacity="0.15" />

  <!-- Equalizer Stem Left -->
  <rect x="120" y="160" width="36" height="192" rx="18" fill="url(#neotunes-brand)" />
  <rect x="172" y="220" width="28" height="132" rx="14" fill="#18D8FF" />

  <!-- Diagonal Bridge -->
  <path d="M 140 176 L 360 368 C 372 378 392 370 392 354 L 392 176 C 392 160 376 150 360 162 Z" fill="url(#neotunes-brand)" />

  <!-- Play Button O Integration -->
  <circle cx="356" cy="256" r="88" fill="#0A0D14" stroke="url(#neotunes-brand)" stroke-width="12" />
  <polygon points="336,206 336,306 406,256" fill="url(#neotunes-brand)" />

  <!-- Gloss Highlight Ring -->
  <rect width="512" height="512" rx="112" fill="url(#gloss-overlay)" />
</svg>
